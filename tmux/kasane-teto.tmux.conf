# ==============================================================================
# Kasane Teto Tmux Theme 🥖 (重音テト)
# Colors:
#   #ff0045 - Teto Red (Point Accent)
#   #eda7ba - Soft Pastel Pink
#   #d924d5 - Vibrant Magenta
#   #3f4750 - Slate Grey
#   #252a32 - Canvas Grey
# ==============================================================================

# Status Bar Base
set -g status-style "bg=#252a32,fg=#ff0045"
set -g status-left-length 50
set -g status-right-length 150

# --- Messaging / Selection ---
set -g message-style "fg=#ffffff,bg=#ff0045,bold"
set -g mode-style "fg=#ffffff,bg=#d924d5"

# --- Panes ---
set -g pane-border-style "fg=#3f4750"
set -g pane-active-border-style "fg=#ff0045"

# --- Status Left ---
set -g status-left "#[fg=#ffffff,bg=#ff0045,bold] 🥖 TETO #[fg=#ff0045,bg=#3f4750,nobold]#[fg=#f0eef5,bg=#3f4750] #S #[fg=#3f4750,bg=#252a32]"

# --- Status Right ---
set -g status-right "#[fg=#3f4750,bg=#252a32]#[fg=#eda7ba,bg=#3f4750] %H:%M:%S #[fg=#ff0045,bg=#3f4750]#[fg=#ffffff,bg=#ff0045,bold] #H "

# --- Window Status ---
setw -g window-status-format "#[fg=#8f97a8,bg=#252a32] #I:#W "
setw -g window-status-current-format "#[fg=#252a32,bg=#d924d5,bold] #[fg=#ffffff,bg=#d924d5]#I:#W #[fg=#d924d5,bg=#252a32,nobold]"

# --- Clock ---
setw -g clock-mode-colour "#ff0045"
