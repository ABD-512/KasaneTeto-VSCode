# vim:ft=kitty

## name: Kasane Teto (重音テト) 🥖
## author: SinsuSquid
## license: MIT
## upstream: https://github.com/SinsuSquid/KasaneTeto-VSCode
## blurb: A vibrant dark theme inspired by Kasane Teto (UTAU / Synthesizer V)

# ==============================================================================
# Kasane Teto Theme for Kitty Terminal 🥖
# Colors:
#   #ff0045 - Teto Red (Point Accent)
#   #eda7ba - Soft Pastel Pink
#   #d924d5 - Vibrant Magenta
#   #3f4750 - Slate Grey (Borders)
#   #252a32 - Canvas Grey
#   #1e2228 - Deep Slate (Terminal BG)
# ==============================================================================

# Special colors
foreground            #f0eef5
background            #1e2228
selection_foreground  #ffffff
selection_background  #ff0045

# Cursor colors
cursor                #ff0045
cursor_text_color     #1e2228

# URL underline color when hovering with mouse
url_color             #ff0045

# Kitty window border colors
active_border_color   #ff0045
inactive_border_color #3f4750
bell_border_color     #d924d5

# OS Window titlebar colors
wayland_titlebar_color  system
macos_titlebar_color    system

# Tab bar colors
active_tab_foreground   #ffffff
active_tab_background   #ff0045
inactive_tab_foreground #8f97a8
inactive_tab_background #252a32
tab_bar_background      #181b20

# Colors for marks (marked text in the terminal)
mark1_foreground #1e2228
mark1_background #ff0045
mark2_foreground #1e2228
mark2_background #eda7ba
mark3_foreground #1e2228
mark3_background #d924d5

# The 16 terminal colors

# black
color0 #252a32
color8 #4d5663

# red
color1 #ff0045
color9 #ff336a

# green
color2  #3ddc97
color10 #52f2ab

# yellow
color3  #f9c74f
color11 #ffe066

# blue
color4  #5c7cfa
color12 #748ffc

# magenta
color5  #d924d5
color13 #e84df2

# cyan
color6  #00f0ff
color14 #5efcff

# white
color7  #f0eef5
color15 #ffffff
